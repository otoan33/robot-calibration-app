services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  # 解析 API。学習中も描画を止めないよう、同じイメージを別コンテナ（別プロセス）で起動する
  analysis:
    build: ./backend
    command: uvicorn backend.analysis:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    environment:
      DRAW_URL: http://backend:8000
      ANALYSIS_URL: http://analysis:8001
    depends_on:
      - backend
      - analysis
    restart: unless-stopped
