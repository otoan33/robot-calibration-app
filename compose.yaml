services:
  backend:
    build: ./backend
    # オフラインでも起動できるよう、python イメージをレジストリに取りに行かない
    pull_policy: never
    ports:
      - "8000:8000"
    # COPY したコードをホスト側で上書きし、コード変更のたびにビルドしなくて済むようにする
    volumes:
      - ./backend:/app/backend
    # 保存したコードを自動で再読み込みする
    command: ["uvicorn", "backend.draw:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

  # 解析 API。学習中も描画を止めないよう、同じイメージを別コンテナ（別プロセス）で起動する
  analysis:
    build: ./backend
    pull_policy: never
    volumes:
      - ./backend:/app/backend
    # 保存したコードを自動で再読み込みする（再読み込みで学習済みモデルは消える）
    command: ["uvicorn", "backend.analysis:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    build: ./frontend
    pull_policy: never
    ports:
      - "8080:8080"
    environment:
      DRAW_URL: http://backend:8000
      ANALYSIS_URL: http://analysis:8001
    # コード変更は docker compose restart frontend で反映する
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      - backend
      - analysis
    restart: unless-stopped
