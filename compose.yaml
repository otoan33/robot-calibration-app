services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  # 解析 API。学習中も描画を止めないよう、同じイメージを別コンテナ（別プロセス）で起動する
  analysis:
    build: ./backend
    command: uvicorn backend.analysis:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    restart: unless-stopped

  # ロボット API のシミュレータ（逐次最適化用）。実機を使うときは frontend の ROBOT_URL を実機に向ける
  robot-sim:
    build: ./backend
    command: uvicorn backend.robot_sim:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    environment:
      DRAW_URL: http://backend:8000
      ANALYSIS_URL: http://analysis:8001
      ROBOT_URL: http://robot-sim:8002
    depends_on:
      - backend
      - analysis
      - robot-sim
    restart: unless-stopped
